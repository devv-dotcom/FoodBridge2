<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>Food Freshness Predictor · FoodBridge</title><link rel="stylesheet" href="auth.css"><style>.predictor{width:min(100%,600px);padding:clamp(28px,5vw,54px);background:#fffdf8;border-radius:28px;box-shadow:0 24px 70px rgba(32,57,35,.16)}.predictor h1{font:600 clamp(2rem,5vw,3.2rem)/1.05 'Playfair Display',serif;margin:0 0 10px}.predictor>p{color:#657166;line-height:1.6}.predictor form{margin-top:25px}.predictor select{width:100%;padding:.82rem .9rem;border:1px solid #d8ded7;border-radius:.7rem;background:#fff;font:inherit}.result{display:grid;gap:8px;margin-top:22px;padding:16px;border-radius:14px;background:#e5f2df;color:#1b472a}.result[data-status="soon"]{background:#fff0c9;color:#815400}.result[data-status="urgent"]{background:#ffe0df;color:#9d2923}.result small{line-height:1.5;color:inherit}.back{display:inline-block;margin-top:18px;color:#1d6638;font-weight:800}</style></head><body><main class="predictor"><a class="brand" href="index.html"><span class="mark">FB</span>FoodBridge</a><h1>Food Freshness<br><em>Predictor</em></h1><p>Estimate donation urgency before listing surplus food.</p><form data-freshness-predictor><label>Preparation time<input name="preparationTime" type="datetime-local" required></label><label>Expiry time<input name="expiryTime" type="datetime-local" required></label><label>Food type<select name="foodType"><option value="veg">Vegetarian</option><option value="non_veg">Non-vegetarian</option></select></label><label>Storage condition<select name="storage"><option value="ambient">Ambient / room temperature</option><option value="insulated">Insulated container</option><option value="chilled">Chilled storage</option></select></label></form><output class="result" data-freshness-result hidden aria-live="polite"></output><a class="back" href="index.html">← Back to FoodBridge</a></main><script type="module">import { initFreshnessPredictor } from './js/freshness.js'; initFreshnessPredictor();</script></body></html>
